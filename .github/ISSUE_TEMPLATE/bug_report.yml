name: Bug 报告
description: 报告可复现问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿上传个人音效、备份、替换记录或未脱敏路径。"
  - type: input
    id: version
    attributes:
      label: 版本与分支
      placeholder: "0.2.0 / 原版或多格式支线"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志与合成样本说明
