name: Build Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Build, test and verify package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION disagree' }
          ./scripts/Build-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-release
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.zip
            release/*.sha256
  draft-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64-release
          path: artifacts
      - name: Create draft release without overwriting existing releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem artifacts -File | ForEach-Object FullName)
          $notes = "Windows x64 portable package. Verify SHA-256 and licensing before publishing."
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --title "NCAE Audio Converter $env:GITHUB_REF_NAME" --notes $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed; existing releases are never overwritten automatically' }
